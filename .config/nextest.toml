# Per-test bounds nextest enforces wherever it runs the suites: every platform
# of the `check` job, and locally. A test still running at its bound is
# terminated and reported as TIMEOUT, failing the run with its name, rather than
# holding its job silently until the CI job limit (Nx buffers each task's
# output, so nothing else would name it).

# Every other test: ended at 600 s (`period` x `terminate-after`). Without it
# nextest never ends one. The slowest outside the app-server journeys measures
# under 3 minutes (168 s, history_index's reindex memory test, in an
# instrumented workspace run), so the bound leaves room for a loaded runner.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }

# The shared Codex app-server journeys (crates/oneharness-e2e/tests/app_server.rs)
# wait on real dispatches, servers and sweepers. One that never ended held a
# shared macOS runner for hours; each is now ended at 180 s, about 1.7 times the
# slowest that passes (105 s, the control suite's pooled phases, instrumented,
# in a full workspace run; mostly waiting on sweeps and lingers, not CPU).
# Ended, it is a TIMEOUT failure that names it, and nextest terminates its
# process group.
# scripts/app-server-hang-bound-test.sh proves this through the runner itself.
[[profile.default.overrides]]
filter = "binary_id(oneharness-e2e::app_server)"
slow-timeout = { period = "60s", terminate-after = 3 }
