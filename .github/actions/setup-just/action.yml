name: Set up just
description: Restore the pinned just binary, or build it from crates.io on a cache miss

# Repository-local on purpose. A third-party setup action is a network fetch on
# every run against a service this repo does not control, and an outage there
# takes a required check down for a reason that has nothing to do with the
# change under test. Here the binary is restored from this repo's own cache, and
# only a cold cache reaches the network at all.

runs:
  using: composite
  steps:
    # `.tool-versions` is the single pin (asdf/mise read it for a local clone),
    # so CI cannot drift to a different `just` than a developer runs. It is also
    # a FILE that becomes a cache key, a workflow output, and a `cargo install`
    # argument, so it is validated as exactly one `x.y.z` before any of that —
    # a version this action merely found non-empty could carry a shell
    # metacharacter into the step below.
    - name: Read the pinned version
      id: pin
      shell: bash
      run: |
        pins="$(awk '$1 == "just" { print $2 }' .tool-versions)"
        count="$(printf '%s' "$pins" | grep -c . || true)"
        version="$(printf '%s\n' "$pins" | head -n 1)"
        if [ "$count" != "1" ] || ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::.tool-versions must pin just as exactly one x.y.z version for the setup-just action to install (found ${count:-0}: '${pins//$'\n'/, }')" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    # The version is part of the immutable key: once one run has built this exact
    # binary, a crates.io outage cannot take later required checks down. OS and
    # architecture keep native executables from crossing runner boundaries.
    - name: Restore just
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/just
          ~/.cargo/bin/just.exe
        key: just-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}
    # Install-when-missing and verify-always live in a script so both paths can
    # be driven by a test; `scripts/check-setup-just.sh` is that test.
    - name: Install and verify just
      shell: bash
      run: scripts/setup-just-install.sh "${{ steps.pin.outputs.version }}" "${{ steps.cache.outputs.cache-hit }}"
