name: Set up just
description: Restore the pinned just binary, or build it from crates.io on a cache miss

# Repository-local on purpose. A third-party setup action is a network fetch on
# every run against a service this repo does not control, and an outage there
# takes a required check down for a reason that has nothing to do with the
# change under test. Here the binary is restored from this repo's own cache, and
# only a cold cache reaches the network at all.

runs:
  using: composite
  steps:
    # `.tool-versions` is the single pin (asdf/mise read it for a local clone),
    # so CI cannot drift to a different `just` than a developer runs.
    - name: Read the pinned version
      id: pin
      shell: bash
      run: |
        version="$(awk '$1 == "just" { print $2 }' .tool-versions)"
        if [ -z "$version" ]; then
          echo "::error::.tool-versions carries no 'just' pin for the setup-just action to install" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    # The version is part of the immutable key: once one run has built this exact
    # binary, a crates.io outage cannot take later required checks down. OS and
    # architecture keep native executables from crossing runner boundaries.
    - name: Restore just
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/just
          ~/.cargo/bin/just.exe
        key: just-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}
    - name: Install just from crates.io
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      # A cache miss must replace whatever else put a `just` in Cargo's bin dir
      # (rust-cache restores one), so the verified version below is this one.
      run: cargo install just --locked --version "${{ steps.pin.outputs.version }}" --force
    - name: Verify just is available
      shell: bash
      run: test "$(just --version)" = "just ${{ steps.pin.outputs.version }}"
