name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The way to sweep one commit on demand — the release workflow's manual
  # fallback reads such a run's verdict like a release pull request's.
  workflow_dispatch:
    inputs:
      tier:
        description: "Gate tier: 'affected' (what a pull request runs) or 'all' (the full sweep)"
        type: choice
        default: all
        options:
          - all
          - affected

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-policy:
    runs-on: ubuntu-latest
    outputs:
      macos_required: ${{ steps.policy.outputs.macos_required }}
      is_release_only: ${{ steps.policy.outputs.is_release_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The checkout is the pull request's own code, so a pull request is
        # classified by its base commit's policy, never by a classifier it
        # carries. A base without that policy, or a base SHA that is not a
        # commit id, requires Mac. tar reads stdin inside the directory rather
        # than parsing it from -C, which mangles a Windows RUNNER_TEMP.
        run: |
          policy=.github/macos-route.mjs
          if [ "$EVENT_NAME" = pull_request ]; then
            trusted="$RUNNER_TEMP/base-macos-policy"
            mkdir -p "$trusted"
            if ! [[ "$BASE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] ||
              ! git archive "$BASE_SHA" .github tools/release-tooling/payload-contract | (cd "$trusted" && tar -xf -) ||
              [ ! -f "$trusted/.github/macos-route.mjs" ]; then
              echo "No base classifier at base commit '$BASE_SHA'; macOS is required."
              printf 'macos_required=true\nis_release_only=false\n' >>"$GITHUB_OUTPUT"
              exit 0
            fi
            policy="$trusted/.github/macos-route.mjs"
          fi
          node "$policy"

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the release-driving squash subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-pr-title.sh

  # Prove the artifact the way a future maintainer meets it: clean checkout ->
  # bootstrap -> the gate, on every supported platform. Which tier is the
  # event's (scripts/ci-gate-tier.sh): release-plz's release pull request runs
  # the full sweep, which the release workflow later reads instead of sweeping
  # the tagged tree again; every other pull request and every push to main runs
  # the affected tier against an explicitly derived base.
  # DO NOT MERGE: the stepped-clock demonstration for #1483. Every leg is
  # forced on (no affected tier, no macOS policy) and runs the four catalog
  # wait proofs and the stepped-clock journeys RUNS times; the journeys step
  # the binary's wall clock back 130 ms mid-wait (the stepped-clock journeys
  # also forward, and by 3 s) through the mock-harness-only seam, then
  # reintroduces a wall-clock-timed lock wait and shows the journeys refuse it.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RUNS: "10"
      FILTER: "package(oneharness-e2e) & test(/a_launch_whose_wait_for_the_lock_runs_out|a_failed_refresh_of_a_stale_catalog_keeps|a_failure_recorded_before_the_catalog_was_written|a_lock_wait_falls_back_at_model_catalog_wait/)"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Record the runner image
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo "- runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "- runner: ${{ runner.os }} ${{ runner.arch }} ($RUNNER_NAME)"
            echo "- commit: $GITHUB_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the suite with the mock-harness seam
        run: cargo nextest run -p oneharness-e2e -p oneharness -p oneharness-mock-harness --features oneharness/mock-harness --locked --no-run
      - name: Run the catalog wait proofs and stepped-clock journeys RUNS times
        run: |
          failed=0
          gaps="$RUNNER_TEMP/gaps.txt"
          : >"$gaps"
          echo "| run | result | tests | fastest stepped - fastest control (ms) |" >>"$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >>"$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 "$RUNS"); do
            log="$RUNNER_TEMP/run-$i.log"
            if cargo nextest run -p oneharness-e2e -p oneharness -p oneharness-mock-harness --features oneharness/mock-harness --locked --no-fail-fast -E "$FILTER" --status-level all --final-status-level all --success-output immediate >"$log" 2>&1; then
              result=pass
            else
              result=FAIL; failed=$((failed + 1))
              cat "$log"
            fi
            summary="$(perl -pe 's/\e\[[0-9;]*m//g' "$log" | grep -E 'Summary' | tail -1 | perl -pe 's/^ *//')"
            echo "run $i/$RUNS: $result — $summary"
            perl -pe 's/\e\[[0-9;]*m//g' "$log" | grep -E '^ *(PASS|FAIL) \[|fastest' || true
            # The gap per step: a Duration prints as s, ms or µs.
            run_gaps="$(perl -ne 'sub ms { my ($v, $u) = @_; $u eq "s" ? $v * 1000 : $u eq "ms" ? $v : $v / 1000 } if (/step (-?\d+) ms: fastest stepped ([\d.]+)(s|ms|µs) of .*fastest control ([\d.]+)(s|ms|µs) of/) { printf "%s:%+.1f ", $1, ms($2, $3) - ms($4, $5) }' "$log" || true)"
            echo "run $i/$RUNS gaps (ms): $run_gaps"
            printf '%s\n' $run_gaps >>"$gaps"
            echo "| $i | $result | $summary | $run_gaps |" >>"$GITHUB_STEP_SUMMARY"
          done
          largest="$(perl -ne 'if (/:([-+][\d.]+)/) { $a = abs($1); $m = $a if $a > $m } END { printf "%.1f", $m }' "$gaps")"
          echo "${{ matrix.os }}: largest clean |gap| $largest ms over $(grep -c . "$gaps") step readings (tolerance 65 ms)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "${{ matrix.os }}: $((RUNS - failed))/$RUNS runs passed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
      # The manager's condition 3 (ruling a2): reintroduce a wall-clock-timed
      # lock wait in waited_until and show each stepped-clock journey refuse
      # it on the stepped-vs-control assertion, at +/-130 ms and +/-3 s.
      - name: "Fault: a wall-clock-timed lock wait fails the stepped-vs-control assertion"
        if: always()
        run: |
          f=crates/oneharness-core/src/io/model_catalog.rs
          perl -pi -e 's/let waited_until = Instant::now\(\) \+ MODEL_CATALOG_WAIT;/let waited_until = wall_now() + MODEL_CATALOG_WAIT;/; s/if Instant::now\(\) >= waited_until \{/if wall_now() >= waited_until {/' "$f"
          [ "$(grep -cE 'wall_now\(\) \+ MODEL_CATALOG_WAIT|if wall_now\(\) >= waited_until' "$f")" = 2 ] || { echo "fault patch did not apply"; exit 1; }
          git diff -- "$f"
          echo "#### fault: wall-clock-timed waited_until" >>"$GITHUB_STEP_SUMMARY"
          bad=0
          for i in 1 2 3; do
            echo "fault run $i:"
            log="$RUNNER_TEMP/fault-$i.log"
            cargo nextest run -p oneharness-e2e -p oneharness -p oneharness-mock-harness --features oneharness/mock-harness --locked --no-fail-fast -E 'package(oneharness-e2e) & test(/a_lock_wait_falls_back_at_model_catalog_wait/)' >"$log" 2>&1 && { echo "fault run $i: the journeys PASSED under the fault"; bad=$((bad + 1)); continue; }
            clean="$(perl -pe 's/\e\[[0-9;]*m//g' "$log")"
            for step in -130 130 -3000 3000; do
              line="$(printf '%s\n' "$clean" | grep -E "^ *step $step ms: the fastest stepped launch fell back .* more than 65ms apart" | head -1 | perl -pe 's/ \(stepped \[.*//; s/^ *//' || true)"
              if [ -n "$line" ]; then
                echo "fault run $i, step $step ms: refused — $line"
                echo "- run $i, step $step ms: refused — $line" >>"$GITHUB_STEP_SUMMARY"
              else
                echo "fault run $i, step $step ms: NOT refused by the stepped-vs-control assertion"
                printf '%s\n' "$clean" | grep -E "^ *step $step ms|panicked|error" | head -5 || true
                echo "- run $i, step $step ms: NOT refused by the stepped-vs-control assertion" >>"$GITHUB_STEP_SUMMARY"
                bad=$((bad + 1))
              fi
            done
          done
          git checkout -- "$f"
          [ "$bad" -eq 0 ]

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The core release tags are what say whether an unresolvable core
          # dependency is a release in flight or a defect; a depth-1 checkout
          # carries none of them.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just package-crates

  # Detect an API break the release-driving subject does not declare. Its own job
  # for the same reasons `package` is — a network-resolved baseline and the
  # release tags — plus one of its own: cargo-semver-checks needs a newer rustc
  # than rust-toolchain.toml pins, so this is the one job that installs `stable`
  # rather than the product's channel. Absent from release.yml deliberately: the
  # PR that precedes a release already proved it, and nothing here may sit
  # between a published Release and its publish jobs.
  semver:
    runs-on: ubuntu-latest
    env:
      # A missing tool is a skip on a developer's box and a failure here: the
      # tier that is meant to enforce this must not quietly prove nothing.
      OH_SEMVER_NO_SKIP: "1"
      # release-plz reads the squash subject, which is the PR title, so that is
      # what declares a break on a pull request. Empty on push, where the merged
      # commit carries it instead.
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v5
        with:
          # "Since the last release" is a per-crate tag, and a depth-1 checkout
          # carries none of them.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-semver-checks
      - run: just semver-check

  # Advisory + license audit, on its own because it needs a network advisory DB.
  # `just deps-check` runs the repo-level `workspace:supply-chain` target, so
  # this job carries Nx's toolchain (Node, and bun for the locked install).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-machete
      - run: just deps-check

  llmlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Reads the pinned channel + components from rust-toolchain.toml. Needed
      # before setup-just, whose cold-cache path builds `just` with Cargo.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # This repo's own cached action, not a third-party setup action: a fetch
      # from a service outside this repo can take a required check down without
      # anything about the change being wrong.
      - uses: ./.github/actions/setup-just
      - uses: astral-sh/setup-uv@v6
      - name: Install llmlint toolchain
        run: ./scripts/setup-llmlint.sh
      # llmlint runs its LLM judge THROUGH oneharness, whose committed
      # `oneharness.toml` selects codex (primary) → claude-code (fallback). The
      # runner has neither harness by default, so without this the judge falls
      # through the whole chain and errors ("codex not found on PATH"). Install +
      # authenticate the primary (codex), mirroring e2e-codex.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex --version
      # Codex ignores OPENAI_API_KEY for headless runs; the documented CI pattern
      # is `codex login --with-api-key` (writes ~/.codex/auth.json). Guarded so a
      # fork PR — which GitHub withholds the secret from — skips it rather than
      # failing here (the lint step below still errors loudly on the missing key).
      - name: Authenticate Codex with the API key (headless)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printenv OPENAI_API_KEY | codex login --with-api-key
          fi
      - name: Validate llmlint config
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint changed files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::llmlint needs OPENAI_API_KEY for the Codex harness" >&2
            exit 1
          fi
          just lint-llm-diff origin/main
