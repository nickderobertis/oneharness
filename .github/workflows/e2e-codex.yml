name: E2E (Codex)

# Live end-to-end check: drive the real OpenAI Codex CLI through oneharness and
# assert the JSON contract (scripts/e2e-codex.sh). Unlike ci.yml this needs
# network, a model call, and the OPENAI_API_KEY secret, so it lives in its own
# workflow gated to trusted contexts only.
#
# Security: a secret must never be reachable by untrusted code. GitHub already
# withholds secrets from fork pull requests; the job `if` below is defense in
# depth — it runs only in the canonical repo and never for a PR whose head is a
# fork, so this workflow can be edited in a fork PR without exposing the key.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "Platform(s): 'default' = this workflow's PR matrix, 'all' = every supported OS, or a single OS. Check one harness/platform without a full rerun."
        type: choice
        default: default
        options:
          - default
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest

permissions:
  contents: read

concurrency:
  group: e2e-codex-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # In CI the harness is installed and auth verified up front, so any e2e skip
  # means detection/install/spawn broke (e.g. an unresolved .cmd shim on Windows)
  # — fail instead of going green having tested nothing. See scripts/e2e-lib.sh.
  OH_E2E_NO_SKIP: 1

jobs:
  live:
    name: codex live e2e (${{ matrix.os }})
    if: >-
      github.repository == 'nickderobertis/oneharness' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      # PR runs this workflow's default platforms; workflow_dispatch overrides
      # via the `os` input ('all' or one OS) so a single harness/platform can be
      # checked without a full rerun. See AGENTS.md > "Live e2e in CI".
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.os != 'default' && (inputs.os == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || format('["{0}"]', inputs.os)) || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify the API key is present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY secret is not set. Create a key at https://platform.openai.com/api-keys, then sync it (just secrets-sync) or set it: gh secret set OPENAI_API_KEY --repo ${{ github.repository }}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex --version

      # Codex does not pick up OPENAI_API_KEY from the env for headless `exec`;
      # the documented CI pattern is to write ~/.codex/auth.json from the key on
      # stdin. Without this, codex hits the Responses API with no bearer (401).
      - name: Authenticate Codex with the API key (headless)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Live e2e against the real CLI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_E2E_MODEL: ${{ vars.CODEX_E2E_MODEL }}
        run: just live-codex
