name: E2E (Turn control)

# CI is the only place goose, opencode and crush can be proven at all, since
# their providers authenticate from keys a developer box generally does not
# carry — so the suite has to be reachable BEFORE a change to the control path
# merges, not only after.

on:
  # Only the control feature's own sources: the wire frames and capability
  # shapes, the socket and the two turn drivers the redirection travels
  # through, the `interrupt` verb, and this suite itself. A PR that touches
  # none of these does not run a minute of this.
  pull_request:
    paths:
      - crates/oneharness-core/src/domain/control.rs
      - crates/oneharness-core/src/domain/dialogue.rs
      - crates/oneharness-core/src/domain/http.rs
      - crates/oneharness-core/src/io/control.rs
      - crates/oneharness-core/src/io/http_turn.rs
      - crates/oneharness-core/src/io/server_pool.rs
      - src/commands/interrupt.rs
      - scripts/e2e-control.sh
      - scripts/e2e-lib.sh
      - scripts/install-e2e.sh
      - .github/workflows/e2e-control.yml
  workflow_dispatch:
    inputs:
      os:
        description: "Platform(s): 'all' = every supported OS, or a single OS. Control sockets are unix-only, so Windows is not offered."
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-latest
          - all

permissions:
  contents: read

concurrency:
  group: e2e-control-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # In CI every harness is installed and every credential supplied up front, so
  # a skip means detection/install/spawn broke — fail instead of going green
  # having tested nothing. See scripts/e2e-lib.sh and e2e-control.sh.
  OH_E2E_NO_SKIP: 1

jobs:
  live:
    name: turn-control live e2e (${{ matrix.os }})
    if: >-
      github.repository == 'nickderobertis/oneharness' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      # Unix-only: the control channel is a unix socket, and e2e-control.sh
      # exits early on Windows. Linux on a pull request; a dispatch can pick a
      # single OS or 'all' to add macos.
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.os == 'all' && '["ubuntu-latest","macos-latest"]' || format('["{0}"]', inputs.os)) || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # Six harnesses x (one interrupt phase + one redirection phase), each with a
    # 15s freeze window and up to three attempts when a turn ends too early.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify every controllable harness's credential is present
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          # Checked up front rather than per phase: with OH_E2E_NO_SKIP set a
          # missing key fails the suite minutes into paid model calls, and the
          # error there names the harness rather than the secret to set.
          missing=()
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || missing+=("CLAUDE_CODE_OAUTH_TOKEN (claude-code)")
          [ -n "${OPENAI_API_KEY:-}" ] || missing+=("OPENAI_API_KEY (codex, goose)")
          [ -n "${ANTHROPIC_API_KEY:-}" ] || missing+=("ANTHROPIC_API_KEY (opencode, crush)")
          [ -n "${COPILOT_GITHUB_TOKEN:-}" ] || missing+=("COPILOT_GITHUB_TOKEN (copilot)")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::missing secret: %s\n' "${missing[@]}"
            echo "Sync them with 'just secrets-sync', or set each: gh secret set <NAME> --repo ${{ github.repository }}"
            exit 1
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install the npm-distributed harness CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex opencode-ai @charmland/crush @github/copilot
          claude --version
          codex --version
          opencode --version
          crush --version
          copilot --version

      - name: Install Goose CLI
        run: |
          # llmlint: ignore[boundary_inputs_validated] Goose publishes download_cli.sh as its only install artifact — no checksum and no signature asset accompanies it (see the note in e2e-goose.yml), so there is nothing here to verify the download against. This is the vendor's documented path over TLS from its own release host, and the identical line already installs goose in e2e-goose.yml, explore-events.yml and explore-hooks.yml; adding a trust root for it is a repo-wide change, not this workflow's to make.
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Codex does not read OPENAI_API_KEY for headless work; the documented CI
      # pattern is to write ~/.codex/auth.json from the key on stdin. Its
      # app-server (the control mechanism here) authenticates the same way.
      - name: Authenticate Codex with the API key (headless)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Live turn-control e2e against every controllable harness
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_E2E_MODEL: ${{ vars.CLAUDE_E2E_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_E2E_MODEL: ${{ vars.CODEX_E2E_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_E2E_MODEL: ${{ vars.OPENCODE_E2E_MODEL }}
          CRUSH_E2E_MODEL: ${{ vars.CRUSH_E2E_MODEL }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_E2E_MODEL: ${{ vars.COPILOT_E2E_MODEL }}
          # Goose takes no --model flag; it resolves provider/model from the
          # environment. e2e-control.sh prefers Anthropic when its key is
          # present because a model that batches all 60 steps into one command
          # can never be caught mid-turn (see the goose phase for the measurement).
          GOOSE_E2E_MODEL: ${{ vars.GOOSE_E2E_MODEL }}
        run: just live-control
