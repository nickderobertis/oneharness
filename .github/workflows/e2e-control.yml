name: E2E (Turn control)

# Live end-to-end check for the turn-control feature: for EVERY harness that
# declares a control mechanism, interrupt a real multi-step turn and prove the
# work stopped, then interrupt again with `--input` and prove the redirected
# work was carried out by the same dispatch (scripts/e2e-control.sh).
#
# This is the per-FEATURE counterpart to the per-harness e2e workflows, like
# e2e-schema.yml. It is the only place goose, opencode and crush can be proven
# at all, since their providers authenticate from keys a developer box
# generally does not carry — so the suite has to be reachable BEFORE a change
# to the control path merges, not only after.
#
# Hence the narrow `pull_request` path filter rather than dispatch-only. Each
# phase drives a real multi-step turn and then waits out a 15-second freeze
# window, twice, for six harnesses, so this must never join the ordinary per-PR
# e2e matrix — the filter below lists only the control feature's own sources, so
# it fires when that path changes and stays silent for every other PR.
# workflow_dispatch is kept for on-demand reruns once this is on main.
#
# macOS is on the SCHEDULE, not on the pull request. This feature has broken on
# macOS three times — `/tmp` canonicalizing to `/private/tmp`, the shorter
# `sun_path` budget, and a refusal-reason mismatch — none of which Linux can
# show, so a platform that never runs the suite is where the next one hides. But
# a second 26-minute leg on every control-path PR is not what that is worth, so
# the daily run carries it: drift surfaces within a day, before anyone depends
# on it, and never in a reviewer's way. A scheduled run also gets its own way of
# being seen, because nobody is watching a checks list for it — the `report` job
# opens (or comments on) an issue when a scheduled leg fails, so a nightly red
# is not a red square in a tab no one opens.
#
# This workflow is outside that gate's shared PR matrix (its paths and its
# unix-only platform set are its own), but scripts/check-e2e-matrix.sh still
# holds the contracts restated below to their sources: every path in the filter
# must exist, every credential a phase in e2e-control.sh reads must be supplied
# here, the schedule must still cover macOS, and any job of any workflow that
# runs one of this repository's own scripts must check the repository out.
#
# `OH_E2E_NO_SKIP` matters more here than anywhere else: e2e-control.sh notes
# and continues past a harness whose credentials are missing rather than
# retiring the suite, so without it a run could report success having exercised
# two harnesses out of six. With it set, any harness that does not run is RED.
#
# Security: same posture as the per-harness workflows — gated to the canonical
# repo, and the job `if` additionally requires a pull request's head to live in
# this repository, so a fork PR head never runs it and the tokens below are
# never reachable by code from a fork (GitHub already withholds secrets from
# fork pull requests; the `if` is defense in depth). A fork can therefore edit
# this file freely.

on:
  # Only the control feature's own sources: the wire frames and capability
  # shapes, the socket and the two turn drivers the redirection travels
  # through, the `interrupt` verb, and this suite itself. A PR that touches
  # none of these does not run a minute of this.
  pull_request:
    paths:
      - crates/oneharness-core/src/domain/control.rs
      - crates/oneharness-core/src/domain/dialogue.rs
      - crates/oneharness-core/src/domain/http.rs
      - crates/oneharness-core/src/io/control.rs
      - crates/oneharness-core/src/io/http_turn.rs
      - crates/oneharness-core/src/io/server_pool.rs
      - src/commands/interrupt.rs
      - scripts/e2e-control.sh
      - scripts/e2e-lib.sh
      - scripts/install-e2e.sh
      - .github/workflows/e2e-control.yml
  # Daily, on the default branch, across ubuntu AND macos — the only place the
  # macOS legs of this feature run at all. 07:11 UTC: off the top of the hour,
  # where GitHub's shared cron queue is at its most backed up.
  schedule:
    - cron: "11 7 * * *"
  workflow_dispatch:
    inputs:
      os:
        description: "Platform(s): 'all' = every supported OS, or a single OS. Control sockets are unix-only, so Windows is not offered."
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-latest
          - all

permissions:
  contents: read

concurrency:
  group: e2e-control-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # In CI every harness is installed and every credential supplied up front, so
  # a skip means detection/install/spawn broke — fail instead of going green
  # having tested nothing. See scripts/e2e-lib.sh and e2e-control.sh.
  OH_E2E_NO_SKIP: 1

jobs:
  live:
    name: turn-control live e2e (${{ matrix.os }})
    if: >-
      github.repository == 'nickderobertis/oneharness' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      # Unix-only: the control channel is a unix socket, and e2e-control.sh
      # exits early on Windows. Linux on a pull request; ubuntu AND macos on the
      # schedule; a dispatch can pick a single OS or 'all'.
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.os == 'all' && '["ubuntu-latest","macos-latest"]' || format('["{0}"]', inputs.os)) || (github.event_name == 'schedule' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]')) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # Six harnesses x (one interrupt phase + one redirection phase), each with a
    # 15s freeze window and up to three attempts when a turn ends too early.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify every controllable harness's credential is present
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          # Checked up front rather than per phase: with OH_E2E_NO_SKIP set a
          # missing key fails the suite minutes into paid model calls, and the
          # error there names the harness rather than the secret to set.
          missing=()
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || missing+=("CLAUDE_CODE_OAUTH_TOKEN (claude-code)")
          [ -n "${OPENAI_API_KEY:-}" ] || missing+=("OPENAI_API_KEY (codex, goose)")
          [ -n "${ANTHROPIC_API_KEY:-}" ] || missing+=("ANTHROPIC_API_KEY (opencode, crush)")
          [ -n "${COPILOT_GITHUB_TOKEN:-}" ] || missing+=("COPILOT_GITHUB_TOKEN (copilot)")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::missing secret: %s\n' "${missing[@]}"
            echo "Sync them with 'just secrets-sync', or set each: gh secret set <NAME> --repo ${{ github.repository }}"
            exit 1
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install the npm-distributed harness CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex opencode-ai @charmland/crush @github/copilot
          claude --version
          codex --version
          opencode --version
          crush --version
          copilot --version

      - name: Install Goose CLI
        run: |
          # llmlint: ignore[boundary_inputs_validated] Goose publishes download_cli.sh as its only install artifact — no checksum and no signature asset accompanies it (see the note in e2e-goose.yml), so there is nothing here to verify the download against. This is the vendor's documented path over TLS from its own release host, and the identical line already installs goose in e2e-goose.yml, explore-events.yml and explore-hooks.yml; adding a trust root for it is a repo-wide change, not this workflow's to make.
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Codex does not read OPENAI_API_KEY for headless work; the documented CI
      # pattern is to write ~/.codex/auth.json from the key on stdin. Its
      # app-server (the control mechanism here) authenticates the same way.
      - name: Authenticate Codex with the API key (headless)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Live turn-control e2e against every controllable harness
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_E2E_MODEL: ${{ vars.CLAUDE_E2E_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_E2E_MODEL: ${{ vars.CODEX_E2E_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_E2E_MODEL: ${{ vars.OPENCODE_E2E_MODEL }}
          CRUSH_E2E_MODEL: ${{ vars.CRUSH_E2E_MODEL }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_E2E_MODEL: ${{ vars.COPILOT_E2E_MODEL }}
          # Goose takes no --model flag; it resolves provider/model from the
          # environment. e2e-control.sh prefers Anthropic when its key is
          # present because a model that batches all 60 steps into one command
          # can never be caught mid-turn (see the goose phase for the measurement).
          GOOSE_E2E_MODEL: ${{ vars.GOOSE_E2E_MODEL }}
        run: just live-control

  # A scheduled run has no pull request to turn red and nobody waiting on it, so
  # left alone a nightly failure is a red square in a tab no one opens. This
  # gives it somewhere to be seen: one open issue, commented on each further
  # night, so a week of failures is one thread rather than seven.
  report:
    name: report a scheduled failure
    needs: live
    if: >-
      failure() && github.event_name == 'schedule' &&
      github.repository == 'nickderobertis/oneharness'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      # The script below lives in this repository, and a job's workspace is
      # empty until it checks out — without this the reporter exits 127 on a
      # missing file, which is exactly how ten consecutive nightly failures
      # went unannounced. scripts/check-e2e-matrix.sh now holds this.
      - uses: actions/checkout@v4

      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: Scheduled turn-control e2e is failing
          BODY: >-
            The nightly live turn-control suite failed. It covers ubuntu and
            macOS; open the run to see which legs failed. macOS runs this suite
            here and nowhere else, so a macOS-only failure is real drift rather
            than a flaky leg to re-run.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # A script, not inline YAML: the create-vs-comment branch is real
        # behavior and scripts/report-workflow-failure-test.sh drives both
        # halves against a stubbed `gh` (this path only ever runs when
        # something is already broken, so it cannot debug itself in place).
        run: bash scripts/report-workflow-failure.sh
