# Comment on every pull request with the lint and type-check suppressions it
# adds (`# noqa`, `#[allow(...)]`, `llmlint: ignore`, ...), each with its rule,
# stated reason and line, so a reviewer sees every bypass without reading the
# whole diff.
#
# Deliberately NOT a required status check: it skips fork pull requests (whose
# read-only token cannot upsert a comment), and a required context that never
# reports would block them forever. It is a review artifact; the gate is
# `just check`. scripts/check-workflows.sh holds this shape.

name: notignored

on:
  pull_request:

# Least privilege: read the tree, write the one sticky comment, nothing else.
permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same ref: only the newest comment is wanted.
concurrency:
  group: notignored-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suppressions:
    # A fork's pull request is granted a read-only token, so the comment upsert
    # would fail on something the contributor has no way to fix.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The scan diffs against the base branch, which a shallow checkout omits.
          fetch-depth: 0

      # The floating major follows each published 0.x release, so fixes arrive
      # without a pin bump; the defaults (the PR's base, the whole repo) fit.
      - uses: nickderobertis/notignored@v0
