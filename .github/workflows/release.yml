name: Release

# Build, archive, checksum, and attach the cross-platform binaries for a
# published GitHub Release.
#
# The Release itself is created by release-plz (see release-plz.yml) when a
# version-bump PR merges. Because release-plz uses a PAT, that Release fires the
# `release: published` event below; this workflow then reads CI's verdict for the
# tagged commit, publishes the crates idempotently, and uploads the archives +
# checksums. Creating a Release by hand in the GitHub UI is the supported manual
# fallback — it triggers the same validated path, and gets the gate run here
# because CI never saw that commit.
#
#   * test               — CI's verdict for the exact tagged commit: publish on
#                           a success, refuse on a failure, and run the same
#                           gate here when CI's run was cancelled or absent.
#   * upload             — build each target on a native runner, attach the
#                           archive + sha256 checksum, sign a keyless Sigstore
#                           build-provenance attestation (OIDC → the public Rekor
#                           log), and publish the `.sigstore.json` bundle beside
#                           the archive. That attestation is a trust root outside
#                           GitHub Releases and any mirror, so scripts/install.sh
#                           (or an auditor) can verify an archive's provenance
#                           independently of where it was fetched.
#   * verify-attestation — install real verifiers (cosign, sigstore-python) and
#                           run install.sh's exact verification against a
#                           just-published archive + bundle, so a flag drift
#                           reddens the release instead of silently degrading.
#   * build-wheels       — wrap the prebuilt binary in per-platform PyPI wheels
#                           with maturin (the ruff/uv pattern); always runs so a
#                           packaging break is caught even while publishing is off.
#   * publish-pypi       — Trusted Publishing (keyless OIDC) to oneharness-cli,
#                           dormant until the PYPI_PUBLISH repo variable is set.
#   * verify-pypi        — install the just-published version the way a consumer
#                           does, retried until the index serves it.
#   * build-python-sdk   — build oneharness-sdk at the Cargo release version,
#                           with an exact dependency on oneharness-cli.
#   * publish-python-sdk — Trusted Publishing (keyless OIDC) to the registered
#                           oneharness-sdk PyPI project after the CLI lands.
#   * verify-python-sdk  — install the SDK and its exact CLI the way a consumer
#                           does, retried until the index serves them.
#   * build-npm          — wrap the same prebuilt binary in per-platform npm
#                           packages (@oneharness/cli-<platform>-<arch>) via
#                           scripts/npm-build.mjs; always runs, same rationale as
#                           the wheels. The npm story mirrors PyPI: a launcher
#                           package (oneharness-cli) picks the matching platform
#                           package through an optional dependency.
#   * publish-npm        — Trusted Publishing (keyless OIDC) + provenance to npm,
#                           dormant until the NPM_PUBLISH repo variable is set;
#                           platform packages first, then the launcher.
#   * verify-npm         — install the just-published packages the way a consumer
#                           does — smoke included, since an unresolvable
#                           per-platform package is not an install failure —
#                           retried until the registry serves them.
#
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Consume CI's verdict for the exact commit this release tags instead of
  # re-running the gate CI already ran on it. A second run of that gate spends
  # twenty minutes learning what is already known, and exposes an approved commit
  # to an unrelated transient failure DURING publication — where a red run reads
  # as a broken release rather than as the flake it is.
  #
  # The gate still runs here whenever CI did not answer for this commit: CI on
  # `main` cancels in progress per ref, so a later push can cancel the tagged
  # commit's run, and a hand-made Release may have no run at all. A CI failure
  # refuses the release outright, naming the run to read.
  #
  # The decision is scripts/ci-verdict.sh, driven against a stand-in GitHub API
  # by scripts/check-ci-verdict.sh; the fallback is `just check` itself, so it
  # cannot drift from what CI runs.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # read CI's own result for the tagged commit
    outputs:
      needs_check: ${{ steps.verdict.outputs.needs_check }}
    steps:
      - uses: actions/checkout@v5
      - name: Read CI's verdict for the tagged commit
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/ci-verdict.sh
      # Reads the pinned channel + components from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.verdict.outputs.needs_check == 'true'
      - uses: actions/setup-node@v4
        if: steps.verdict.outputs.needs_check == 'true'
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        if: steps.verdict.outputs.needs_check == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.verdict.outputs.needs_check == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.verdict.outputs.needs_check == 'true'
        with:
          tool: just,nextest,cargo-llvm-cov,shellcheck
      - if: steps.verdict.outputs.needs_check == 'true'
        run: just bootstrap
      - name: Run the gate CI did not answer for
        if: steps.verdict.outputs.needs_check == 'true'
        run: just check

  publish-crates:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Publish crates in dependency order, idempotently
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh

  upload:
    name: upload (${{ matrix.target }})
    needs: test
    permissions:
      contents: write      # attach the archive + checksum to the Release
      id-token: write      # mint the keyless OIDC token for Sigstore (no secret)
      attestations: write  # record the build-provenance attestation on GitHub
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per target so nothing needs cross-compilation:
          # arm64 Linux builds on a hosted arm64 runner; macOS cross-builds
          # x86_64<->arm64 within the Apple toolchain (no emulation/Docker).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build, archive, checksum, and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: oneharness
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          include: README.md,LICENSE,CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
      # Sign the built archive with a keyless Sigstore build-provenance
      # attestation. It is logged to the public Rekor transparency log and bound
      # to this workflow's OIDC identity — a trust root a download mirror cannot
      # forge. The action leaves the archive in the workspace; attest that exact
      # file (the glob matches exactly one archive per target).
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: oneharness-*-${{ matrix.target }}.${{ matrix.ext }}
      # Publish the Sigstore bundle as a release asset, named by replacing the
      # archive extension with `.sigstore.json` (matching install.sh's bundlefile
      # and the .sha256 convention). Shipping the bundle — rather than relying on
      # GitHub's attestation API — is what lets scripts/install.sh verify OFFLINE
      # with cosign/sigstore/gh after downloading everything from a mirror, the
      # whole point for networks that can't reach github.com. The signature is
      # bound to this workflow's OIDC identity, so a mirror serving the bundle
      # cannot forge it.
      - name: Publish attestation bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          asset="oneharness-${TAG}-${TARGET}.sigstore.json"
          cp "$BUNDLE" "$asset"
          gh release upload "$TAG" "$asset" --clobber --repo "${{ github.repository }}"

  # Prove the offline verification path end to end on every real release: install
  # the verifiers the easy ways (the official cosign installer action; `pip
  # install sigstore` from PyPI) and run the EXACT commands scripts/install.sh
  # uses against a just-published archive + its bundle. This is the only place the
  # real invocations meet a genuine GitHub-OIDC-signed bundle, so it keeps
  # install.sh's flags (--new-bundle-format, --type, the pinned identity/issuer,
  # `verify github --offline --repository`) honest — a mismatch reddens the
  # release instead of silently degrading users to the checksum fallback.
  verify-attestation:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      # Pin >= 2.4.0: --new-bundle-format lands there and the action's unpinned
      # default can be older.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The registry-only bootstrap install.sh recommends for hosts that cannot
      # reach github.com; pinned to a version known to verify DSSE bundles offline.
      - run: pip install sigstore==4.3.0
      - name: Verify a release archive against its Sigstore bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$TAG"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$tag' is not a supported vX.Y.Z tag" >&2
            exit 1
          fi
          target="x86_64-unknown-linux-gnu"
          base="oneharness-${tag}-${target}"
          # No checkout here, so gh cannot infer the repo from git — name it.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir . \
            --pattern "${base}.tar.gz" --pattern "${base}.sigstore.json"
          cosign verify-blob-attestation \
            --new-bundle-format \
            --bundle "${base}.sigstore.json" \
            --type "https://slsa.dev/provenance/v1" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
            "${base}.tar.gz"
          echo "cosign verified ${base}.tar.gz."
          sigstore verify github \
            --bundle "${base}.sigstore.json" \
            --offline \
            --repository "$GITHUB_REPOSITORY" \
            "${base}.tar.gz"
          echo "sigstore-python verified ${base}.tar.gz."

  # PyPI wheels: maturin's `bin` bindings wrap the prebuilt binary in
  # per-platform wheels (the ruff/uv pattern), so `pip install oneharness-cli` is
  # a seconds-fast binary install anywhere PyPI is reachable — the quickest
  # trustworthy path where github.com is blocked but package registries are open.
  # Wheels build on every release (unconditioned, so a packaging break is caught
  # even before publishing is activated); maturin-action compiles inside
  # manylinux containers on Linux for broad glibc compatibility. The wheel
  # version comes from Cargo.toml, so release-plz stays the single version driver.
  build-wheels:
    name: build-wheels (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirror the binary `upload` matrix: native runners per target.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  # PyPI publishing self-activates when the PYPI_PUBLISH repository variable is
  # set to 'true' (Trusted Publishing is keyless — there is no secret whose
  # presence could gate it like a token does). Until the PyPI project exists with
  # this repo + release.yml registered as its Trusted Publisher and the variable
  # is set, publishing stays dormant while the wheels still build. No GitHub
  # Actions environment is configured on the Trusted Publisher, so this job must
  # not declare one either — an environment claim in the OIDC token would fail to
  # match. Trusted Publishing (OIDC, `id-token: write`) also auto-generates PEP
  # 740 attestations, so pip consumers get build provenance too.
  publish-pypi:
    needs: build-wheels
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Idempotent: a re-run (e.g. to complete a sibling publish) must not
          # red-fail because these wheels already exist on PyPI.
          skip-existing: true

  # Post-publish gate: prove the just-published version is pip-installable by
  # installing it. PyPI's JSON API answers before the simple index a `pip
  # install` reads, so waiting on the metadata and installing once reddens a
  # release that published perfectly; the thing retried here is the install
  # itself. A failure means a broken release, not a blocked publish (the wheel
  # is already public).
  verify-pypi:
    needs: publish-pypi
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install oneharness-cli from PyPI and smoke-test it
        run: scripts/verify-published.sh pypi-cli "${GITHUB_REF_NAME#v}"

  # The pure-Python SDK is generated from Rust-owned contracts and stamped from
  # Cargo.toml at packaging time. Its wheel and sdist depend on the exact same
  # oneharness-cli version, so the language client and subprocess protocol cannot
  # drift independently.
  build-python-sdk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Same verdict as the gate above: CI already ran this for this commit
      # unless its run was cancelled or absent.
      - name: Run the Python SDK gate CI did not answer for
        if: needs.test.outputs.needs_check == 'true'
        run: just python-sdk-check
      - name: Build the version-synchronized SDK distributions
        run: |
          pkgdir="$(node scripts/python-sdk-pack.mjs)"
          uv build --out-dir python-sdk-artifact "$pkgdir"
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk
          path: python-sdk-artifact/*

  # The oneharness-sdk Trusted Publisher is already registered without a GitHub
  # Actions environment. Keep this job environment-free so the OIDC claim
  # matches; no long-lived PyPI token is stored. Waiting on publish-pypi ensures
  # the SDK's exact oneharness-cli dependency is available before the SDK lands.
  publish-python-sdk:
    needs: [publish-pypi, build-python-sdk]
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-sdk
          path: python-sdk-artifact
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-sdk-artifact
          skip-existing: true

  # Registry propagation is asynchronous, so the install is what is retried:
  # install the real release from PyPI, verify both synchronized versions, then
  # exercise the SDK's packaged CLI dependency through the public subprocess
  # boundary — on the oldest supported interpreter.
  verify-python-sdk:
    needs: publish-python-sdk
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install the SDK from PyPI and exercise its exact CLI dependency
        run: scripts/verify-published.sh pypi-sdk "${GITHUB_REF_NAME#v}"

  # npm packages: scripts/npm-build.mjs wraps the prebuilt binary in a
  # per-platform package (@oneharness/cli-<platform>-<arch>), the direct analogue
  # of the maturin wheels. Built on every release (unconditioned, so a packaging
  # break is caught even before publishing is activated) on the same native-runner
  # matrix as the binary `upload` job, then `npm pack`ed to a tarball artifact.
  # The version comes from Cargo.toml (npm-build.mjs reads it), so release-plz
  # stays the single version driver.
  build-npm:
    name: build-npm (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the platform binary
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release --locked --target "${{ matrix.target }}"
      - name: Assemble and pack the platform npm package
        run: |
          bin="target/${{ matrix.target }}/release/oneharness"
          [ -f "$bin" ] || bin="${bin}.exe"
          pkgdir="$(node scripts/npm-build.mjs platform --target "${{ matrix.target }}" --binary "$bin" --out npm/dist)"
          mkdir -p npm-artifacts
          (cd "$pkgdir" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm-artifacts")
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: npm-artifacts/*.tgz

  build-node-sdk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - if: needs.test.outputs.needs_check == 'true'
        run: just bootstrap
      - name: Run the Node SDK gate CI did not answer for
        if: needs.test.outputs.needs_check == 'true'
        run: just sdk-check
      # `npm/oneharness-sdk/dist` is gitignored, so the pack below needs it built
      # here whether or not the gate that also builds it ran.
      - name: Build the SDK's publishable sources
        run: just sdk-build
      - name: Pack the version-synchronized SDK
        run: |
          pkgdir="$(node scripts/sdk-pack.mjs)"
          mkdir -p sdk-artifact
          (cd "$pkgdir" && npm pack --pack-destination "$GITHUB_WORKSPACE/sdk-artifact")
      - uses: actions/upload-artifact@v4
        with:
          name: node-sdk
          path: sdk-artifact/*.tgz

  # npm publishing activates when the NPM_PUBLISH repository variable is 'true'
  # AND the NPM_TOKEN secret is present (an npm automation/granular-access token
  # with publish rights to oneharness-cli and the @oneharness scope). Publishes
  # the per-platform packages first, then the launcher that depends on them.
  # Until both are set, publishing stays dormant while the packages still build.
  publish-npm:
    needs: [build-npm, build-node-sdk]
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # registry-url makes setup-node write an .npmrc that authenticates with
      # NODE_AUTH_TOKEN (the npm token), so `npm publish` is token-authenticated.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: node-sdk
          path: sdk-artifact
      - name: Publish platform packages, then the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Platform packages first: the launcher's optionalDependencies pin their
          # exact versions, so they must exist for a subsequent install to resolve.
          # Glob against an ABSOLUTE base so each argument is an absolute path: npm
          # treats a bare `dir/file.tgz` as a `user/repo` GitHub spec (and tries to
          # git-clone it), not a local tarball — an absolute path is unambiguous.
          for tgz in "$GITHUB_WORKSPACE"/npm-artifacts/*.tgz; do
            scripts/publish-npm.sh "$tgz"
          done
          # Build and publish the launcher (oneharness-cli). It carries no binary,
          # so it needs no prebuilt target — just the version-stamped manifest.
          launcher="$(node scripts/npm-build.mjs launcher --out npm/dist)"
          scripts/publish-npm.sh "$launcher" "$GITHUB_WORKSPACE"/sdk-artifact/*.tgz

  # Post-publish gate: prove the just-published CLI and SDK are installable from
  # npm by installing them. `npm view` answering says nothing about the
  # per-platform @oneharness/cli-<platform>-<arch> package the launcher needs —
  # and because npm installs that as an OPTIONAL dependency, an install that
  # resolved none of it still exits 0. So the retried unit is the install
  # TOGETHER with the smoke that runs the binary, which is the only thing that
  # notices.
  verify-npm:
    needs: publish-npm
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install oneharness-cli from npm and smoke-test it
        run: scripts/verify-published.sh npm-cli "${GITHUB_REF_NAME#v}"
      - name: Install the SDK from npm and exercise its packaged CLI dependency
        run: scripts/verify-published.sh npm-sdk "${GITHUB_REF_NAME#v}"
