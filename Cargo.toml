[workspace]
members = ["crates/oneharness-core"]

# Metadata both crates share, inherited with `.workspace = true`. `version` and
# `description` stay per-crate: the binary and the engine release on their own
# tags and describe different things.
[workspace.package]
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/nickderobertis/oneharness"

# Every requirement both crates take, stated once so a bump moves both. Cargo
# answers two diverging `windows-sys` requirements with a second copy rather than
# an error. Features each crate needs beyond `serde`'s shared `derive` are
# named at the member.
[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = "0.61"

[package]
name = "oneharness"
version = "0.17.0"
edition.workspace = true
rust-version.workspace = true
description = "One CLI to drive many agentic coding harnesses non-interactively and return uniform JSON."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cli", "agent", "claude", "codex", "harness"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "oneharness"
path = "src/main.rs"

# Test-only fixture: a fake harness binary the e2e tests drive via a `--bin`
# override, so the spawn/parse/parallel path is proven hermetically and
# cross-platform. Gated behind a feature so it never ships in `cargo install`.
[[bin]]
name = "oneharness-mock-harness"
path = "tests/support/mock_harness_main.rs"
required-features = ["mock-harness"]

[[example]]
name = "generate_sdk_schema"
required-features = ["sdk-schema"]

[features]
# Builds the mock harness fixture. Enabled by `just test`/`just check` and CI.
mock-harness = ["oneharness-core/mock-harness"]
# Builds the Rust-owned schema generator shared by language SDKs.
sdk-schema = ["oneharness-core/sdk-schema"]

# Depended on by path for local builds, with a `version` requirement so the
# crate is publishable: `cargo publish` rewrites the path dep to this registry
# version, which release-plz keeps in step with `oneharness-core`'s own version.
[dependencies]
oneharness-core = { path = "crates/oneharness-core", version = "0.19.0" }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }

# The history reader of oneharness v0.17.0 — the release before `events`
# carried anything but tool activity — is `oneharness-core` 0.19.0, pinned
# exactly under its own name so `tests/history_compat.rs` proves that what this
# build writes is still read by the PUBLISHED code, not by this tree's.
[dev-dependencies]
# llmlint: ignore[crates_stay_in_one_cargo_workspace] Deliberately the published 0.19.0 from crates.io, not the workspace member: it is the fixed compatibility anchor (oneharness v0.17.0's history reader) that `tests/history_compat.rs` reads this build's history with, which the sibling path crate by definition cannot be. Test-only; the binary still builds against the path member alone.
oneharness-core-v0-19 = { package = "oneharness-core", version = "=0.19.0" }

# Integration tests drive the binaries directly via the cargo-provided
# CARGO_BIN_EXE_* paths and parse JSON with serde_json (already a dependency),
# so no extra test-only crates are needed — except one: proving the library run
# path prints nothing means redirecting this process's own fd 1 across the call
# (`tests/library.rs`), which needs `dup`/`dup2`. Already in the tree via
# `oneharness-core`, so it costs no extra download.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

# The other half of the same proof: a `RunControls::supervisor` puts each harness
# child into the caller's own process group on Unix and its own Job Object here,
# and `tests/library.rs` asserts that membership from the caller's side —
# `IsProcessInJob` is the only thing that can answer it. The version is the
# workspace's, the one `oneharness-core` inherits too, so it costs no extra
# download.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }

[profile.release]
strip = true
lto = "thin"
