[workspace]
members = ["crates/oneharness-core"]

# The metadata both publishable crates must agree on, stated once. The root is
# still the `oneharness` package — cargo permits a package to carry these tables
# too — so what changes is only where the values live: each crate inherits with
# `.workspace = true` and restates none, and a license or MSRV move edits one
# line instead of two that drift a release apart. `version` stays per-crate on
# purpose (the binary and the engine release on their own tags), as does
# `description`, which says a different thing about each.
[workspace.package]
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/nickderobertis/oneharness"

# The single source for every requirement both crates take. The binary crate's
# `windows-sys` dev-dependency rides for free on the engine's own Windows
# dependency only while the two resolve to one version, and cargo answers a
# divergence with a second copy rather than a complaint. Inheriting is what keeps
# that from rotting: each requirement lives here alone — a member restating it is
# ignored — so a bump moves both. `windows-sys` names only the features each
# crate uses at the member; `serde`'s `derive` is common to both, so it is stated
# here with the requirement.
[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = "0.61"

[package]
name = "oneharness"
version = "0.16.2"
edition.workspace = true
rust-version.workspace = true
description = "One CLI to drive many agentic coding harnesses non-interactively and return uniform JSON."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cli", "agent", "claude", "codex", "harness"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "oneharness"
path = "src/main.rs"

# Test-only fixture: a fake harness binary the e2e tests drive via a `--bin`
# override, so the spawn/parse/parallel path is proven hermetically and
# cross-platform. Gated behind a feature so it never ships in `cargo install`.
[[bin]]
name = "oneharness-mock-harness"
path = "tests/support/mock_harness_main.rs"
required-features = ["mock-harness"]

[[example]]
name = "generate_sdk_schema"
required-features = ["sdk-schema"]

[features]
# Builds the mock harness fixture. Enabled by `just test`/`just check` and CI.
mock-harness = ["oneharness-core/mock-harness"]
# Builds the Rust-owned schema generator shared by language SDKs.
sdk-schema = ["oneharness-core/sdk-schema"]

# Depended on by path for local builds, with a `version` requirement so the
# crate is publishable: `cargo publish` rewrites the path dep to this registry
# version, which release-plz keeps in step with `oneharness-core`'s own version.
[dependencies]
oneharness-core = { path = "crates/oneharness-core", version = "0.18.0" }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Integration tests drive the binaries directly via the cargo-provided
# CARGO_BIN_EXE_* paths and parse JSON with serde_json (already a dependency),
# so no extra test-only crates are needed — except one: proving the library run
# path prints nothing means redirecting this process's own fd 1 across the call
# (`tests/library.rs`), which needs `dup`/`dup2`. Already in the tree via
# `oneharness-core`, so it costs no extra download.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

# The other half of the same proof: a `RunControls::supervisor` puts each harness
# child into the caller's own process group on Unix and its own Job Object here,
# and `tests/library.rs` asserts that membership from the caller's side —
# `IsProcessInJob` is the only thing that can answer it. The version is the
# workspace's, the one `oneharness-core` inherits too, so it costs no extra
# download.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }

[profile.release]
strip = true
lto = "thin"
