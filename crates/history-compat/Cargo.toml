# Never published: this crate exists only so the history compatibility test can
# take the PUBLISHED `oneharness-core` 0.19.0 (oneharness v0.17.0's history
# reader) beside this tree's own. Carried by the binary crate, that pin put
# `oneharness-core` 0.19.0 under two names in one manifest once `cargo package`
# rewrote the path dependency to its registry version, and Cargo refuses to
# verify such a tarball — so `just package-crates` could never pass.
[package]
name = "oneharness-history-compat"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
oneharness-core = { path = "../oneharness-core" }
# llmlint: ignore[crates_stay_in_one_cargo_workspace] Deliberately the published 0.19.0 from crates.io, not the workspace member: it is the fixed compatibility anchor (oneharness v0.17.0's history reader) that `tests/v0_17_reader.rs` reads this build's history with, which the sibling path crate by definition cannot be.
oneharness-core-v0-19 = { package = "oneharness-core", version = "=0.19.0" }
