[package]
name = "oneharness-core"
version = "0.4.1"
edition = "2021"
rust-version = "1.82"
description = "Reusable engine behind the oneharness CLI: harness registry, hook rendering/installation, and harness config sync."
license = "MIT"
repository = "https://github.com/nickderobertis/oneharness"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "7"
wait-timeout = "0.2"
toml = "1.0.7"
# JSON Schema validation for structured-output runs. `default-features = false`
# drops the optional `resolve-http`/`resolve-file` reference resolvers (and the
# `reqwest` they pull), keeping the engine offline and portable — in-document
# `$ref`s still resolve. Pinned to a 0.33.x line whose MSRV (1.71) stays at or
# below the crate's declared `rust-version`.
jsonschema = { version = "0.33", default-features = false }
# Regex matching for mock rulesets (`domain::mock` MatchSpec `*_regex` / input
# predicates). The `regex` crate is the linear-time RE2-style engine — no
# catastrophic backtracking, so a caller-supplied (untrusted) pattern can never
# hang the responder — and is already in the tree via `jsonschema`, so this adds
# no new download.
regex = "1"
