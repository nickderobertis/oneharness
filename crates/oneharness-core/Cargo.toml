[package]
name = "oneharness-core"
version = "0.2.38"
edition = "2021"
rust-version = "1.82"
description = "Reusable engine behind the oneharness CLI: harness registry, hook rendering/installation, and harness config sync."
license = "MIT"
repository = "https://github.com/nickderobertis/oneharness"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "7"
wait-timeout = "0.2"
toml = "1.0.7"
