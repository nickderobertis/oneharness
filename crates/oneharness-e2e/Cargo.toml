# Never published: the binary e2e journeys (`tests/cli.rs`) — the suite that
# drives the built `oneharness` and `oneharness-mock-harness` executables as
# subprocesses. A crate of its own so a change the binary cannot see skips it;
# its Nx `test` target builds both executables in the same cargo invocation and
# the suite reads them from the shared target directory (`workspace_bin`).
[package]
name = "oneharness-e2e"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
# The CLI's clap tree and its public constants, read in-process to enumerate
# every verb and pin documented defaults against the source of truth.
oneharness = { path = "../.." }
oneharness-core = { path = "../oneharness-core" }
clap = { workspace = true }
serde_json = { workspace = true }
# Holds a shared model catalog's lock from the test process, so a journey can
# keep a launch waiting past MODEL_CATALOG_WAIT; the engine locks with it too.
fs2 = { workspace = true }
# Keys a shared model catalog's files as the engine does, so a journey can
# seed a lock, record or catalog before any launch writes one.
uuid = { workspace = true, features = ["v5"] }

# Signals the pooled app-server journeys send by pid: SIGKILL a dispatch, or a
# shared server, the journey itself started.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
