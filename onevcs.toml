# This repository's own warm-pool maintenance, declared for onevcs. onevcs pool
# maintenance reads this file from the publication checkout of the base branch
# (never a session's branch) and runs `command` in each idle warm-pool slot's
# worktree, never in a slot a session holds.
#
# The command is the justfile's `pool-maintenance` recipe: the pinned
# cargo-prune-superseded over this repository's cargo target dir, removing each
# compiled unit's superseded builds older than 2 days and keeping its newest
# build plus every build modified within those 2 days, so rebuilds stay warm.
# How long one pass takes is budgeted in pool-maintenance/budgets.yaml.
schema_version = 1

[pool.maintain]
command = ["just", "pool-maintenance"]
timeout = "30m"
