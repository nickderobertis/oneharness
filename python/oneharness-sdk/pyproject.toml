[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "oneharness-sdk"
version = "0.0.0.dev0"
description = "Typed async Python SDK for oneharness"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick DeRobertis" }]
keywords = ["cli", "agent", "claude", "codex", "harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.18,<5",
    # llmlint: ignore[projects_stay_in_one_uv_workspace] A release placeholder, not a sibling link: scripts/python-sdk-pack.mjs stamps it to the exact `oneharness-cli` version the release publishes beside this SDK. A workspace source would make every sync build the Rust binary as a wheel; the workspace root leaves it out of the dev resolve instead (python/pyproject.toml).
    "oneharness-cli==0.0.0.dev0",
]

# The SDK's own toolchain, resolved into the workspace's one `uv.lock`
# (`python/uv.lock`) for every Python the package supports, 3.9 included.
[dependency-groups]
dev = [
    "coverage[toml]==7.10.7",
    "ruff==0.14.13",
    "ty==0.0.85",
    "types-jsonschema==4.25.1.20251009",
]

[project.urls]
Homepage = "https://github.com/nickderobertis/oneharness"
Repository = "https://github.com/nickderobertis/oneharness"

[tool.uv.build-backend]
module-name = "oneharness_sdk"
module-root = "src"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = [
    "E501",  # JSON protocol fixtures are clearer as intact strings.
    "UP045", # Optional keeps runtime annotations unambiguous on Python 3.9.
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "S404", # The generator deliberately invokes Cargo across the schema boundary.
    "S603", # Its fixed argument vector is not built from untrusted input.
    "S607", # Cargo is a required developer tool resolved from the active toolchain.
]
"test/**" = [
    "S101", # Assertions are the test contract.
    "S404", # Subprocess boundaries are intentional integration coverage.
    "S603", # Test commands use fixed arguments or controlled fixtures.
    "S607", # Tests intentionally resolve required developer tools from PATH.
]

# ty has no single strict switch, so every rule is an error, the off-by-default
# soundness rules included, and each ty release's new rules join them. The
# strict checks ty has no rule for are listed in AGENTS.md.
[tool.ty.environment]
python-version = "3.9"

[tool.ty.src]
include = ["src", "scripts", "test"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
branch = true
source = ["oneharness_sdk"]

[tool.coverage.report]
fail_under = 95
show_missing = true
