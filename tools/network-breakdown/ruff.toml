# The Python SDK's rules (python/oneharness-sdk/pyproject.toml), for
# scripts/codex-network-breakdown.py and its test, which run on that same
# Python 3.9 floor.
target-version = "py39"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = [
    "UP045", # Optional keeps runtime annotations unambiguous on Python 3.9.
]

[lint.per-file-ignores]
"**/codex-network-breakdown.py" = [
    "S404", # Building the namespace means running pasta, mount, ip, apt-get and dpkg.
    "S603", # Each argv is fixed by this script or is the caller's own launch argv.
    "S607", # Those tools are resolved from PATH on purpose, as the caller's shell would.
]
"**/test_codex_network_breakdown.py" = [
    "S101", # Assertions are the test contract.
    "S404", # The script under test is driven as a subprocess, as a user runs it.
    "S603", # Every argv is fixed by the test.
]
"**/transfer_double.py" = [
    "S404", # --detach hands its transfers to a detached child process.
    "S603", # That child's argv is this file and its own validated arguments.
]
