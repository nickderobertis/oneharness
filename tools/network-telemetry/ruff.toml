# The Python SDK's ruff settings, which this project's files share (their
# Python 3.9 floor and rule set), plus what only these files do.
extend = "../../python/oneharness-sdk/pyproject.toml"

[lint.per-file-ignores]
"**/e2e-netmeasure.py" = [
    "S404", # Building the namespace means running pasta and mount.
    "S603", # Each argv is fixed here or is the shim's own launch argv.
    "S607", # pasta and mount are resolved from PATH, as the suite's shell would.
]
"**/test_*.py" = [
    "S101", # Assertions are the test contract.
    "S404", # The shim, suites and check step are driven as subprocesses, as a run drives them.
    "S603", # Every argv is fixed by the test.
    "S607", # bash, uv and the suites' tools are resolved from PATH, as a run resolves them.
]
"**/support.py" = ["S404", "S603", "S607"]
"**/transfer.py" = ["S404", "S603"]
